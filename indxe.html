<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教务处系统网站后台</title>
    <link rel="icon" href="https://gitee.com/hcbug/picture1/raw/master/20260706124317969.webp" type="image/x-icon">
    <style>
        :root {
            --bg: #f0f6fb;
            --card-bg: #ffffff;
            --primary: #5b9fd4;
            --primary-light: #e8f2fa;
            --primary-dark: #3d7db5;
            --success: #4caf84;
            --danger: #e0556a;
            --text: #2c3e50;
            --text-secondary: #6b7d8e;
            --border: #dce6f0;
            --shadow: 0 8px 32px rgba(91, 159, 212, 0.12);
            --shadow-lg: 0 16px 48px rgba(44, 62, 80, 0.18);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            background: linear-gradient(160deg, #eaf4fb 0%, #f0f6fb 30%, #dce9f5 60%, #e8f2fa 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -120px;
            right: -120px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(91, 159, 212, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -100px;
            left: -100px;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(91, 159, 212, 0.06) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .main-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 500px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 36px 30px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: all var(--transition);
            position: relative;
        }
        .card:hover {
            box-shadow: var(--shadow-lg);
            border-color: #c8dae8;
        }
        .card-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text);
            text-align: center;
            margin-bottom: 6px;
            letter-spacing: -0.3px;
        }
        .card-subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 28px;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 20px;
        }
        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 7px;
            letter-spacing: 0.2px;
        }
        .card-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .card-option {
            flex: 1;
            min-width: 80px;
            padding: 12px 16px;
            text-align: center;
            border-radius: var(--radius-sm);
            border: 2px solid var(--border);
            cursor: pointer;
            background: #fafcfd;
            font-weight: 500;
            color: var(--text);
            transition: all var(--transition);
            user-select: none;
            font-size: 0.95rem;
            position: relative;
        }
        .card-option:hover {
            border-color: #b8cfe0;
            background: #f5f9fc;
        }
        .card-option.selected {
            border-color: var(--primary);
            background: var(--primary-light);
            color: var(--primary-dark);
            font-weight: 700;
            box-shadow: 0 0 0 3px rgba(91, 159, 212, 0.15);
            transform: translateY(-1px);
        }
        .card-option.selected::after {
            content: '✓';
            position: absolute;
            top: -8px;
            right: -6px;
            background: var(--primary);
            color: #fff;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .input-field {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            border: 2px solid var(--border);
            font-size: 0.95rem;
            outline: none;
            transition: all var(--transition);
            background: #fafcfd;
            color: var(--text);
            font-family: inherit;
        }
        .input-field:focus {
            border-color: #a0c4e0;
            box-shadow: 0 0 0 3px rgba(91, 159, 212, 0.08);
            background: #fff;
        }
        .input-field.valid {
            border-color: var(--success) !important;
            background: #f6fdf9 !important;
            box-shadow: 0 0 0 3px rgba(76, 175, 132, 0.1) !important;
        }
        .input-field.invalid {
            border-color: var(--danger) !important;
            background: #fefafa !important;
            box-shadow: 0 0 0 3px rgba(224, 85, 106, 0.08) !important;
            animation: shake 0.4s ease;
        }
        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-4px);
            }
            50% {
                transform: translateX(4px);
            }
            75% {
                transform: translateX(-3px);
            }
        }

        .hint-text {
            font-size: 0.78rem;
            margin-top: 5px;
            font-weight: 500;
            min-height: 18px;
            transition: all var(--transition);
        }
        .hint-text.red {
            color: var(--danger);
        }
        .hint-text.green {
            color: var(--success);
        }
        .hint-text.gray {
            color: #999;
        }

        .btn {
            display: inline-block;
            padding: 13px 28px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            border: none;
            transition: all var(--transition);
            letter-spacing: 0.3px;
            text-align: center;
            font-family: inherit;
            width: 100%;
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 14px rgba(91, 159, 212, 0.3);
        }
        .btn-primary:hover {
            background: var(--primary-dark);
            box-shadow: 0 6px 20px rgba(61, 125, 181, 0.35);
            transform: translateY(-1px);
        }
        .btn-primary:active {
            transform: scale(0.97);
        }
        .btn-gray {
            background: #d5dde5;
            color: #8899aa;
            cursor: not-allowed;
            box-shadow: none;
        }
        .btn-gray.active {
            background: var(--primary);
            color: #fff;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(91, 159, 212, 0.3);
        }
        .btn-gray.active:hover {
            background: var(--primary-dark);
        }
        .btn-sm {
            padding: 8px 16px;
            font-size: 0.8rem;
            border-radius: 18px;
            width: auto;
            background: transparent;
            color: var(--primary);
            border: 1.5px solid var(--primary);
            cursor: pointer;
            font-weight: 500;
        }
        .btn-sm:hover {
            background: var(--primary-light);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(30, 40, 55, 0.55);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .modal-dialog {
            background: #fff;
            border-radius: var(--radius);
            padding: 30px 26px;
            width: 92%;
            max-width: 440px;
            box-shadow: var(--shadow-lg);
            position: relative;
            animation: slideUp 0.3s ease;
            max-height: 85vh;
            overflow-y: auto;
            transition: transform 0.15s ease;
        }
        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .modal-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text);
            text-align: center;
            margin-bottom: 4px;
        }
        .modal-subtitle {
            font-size: 0.82rem;
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 20px;
            font-weight: 400;
        }
        .modal-divider {
            border: none;
            border-top: 1px solid var(--border);
            margin: 14px 0;
        }

        .slider-container {
            position: relative;
            width: 100%;
            height: 48px;
            background: #e8eef4;
            border-radius: 24px;
            overflow: hidden;
            user-select: none;
            cursor: default;
        }
        .slider-track {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: linear-gradient(90deg, #c5ddf5, var(--primary));
            border-radius: 24px;
            transition: width 0.05s linear;
            width: 0%;
        }
        .slider-thumb {
            position: absolute;
            top: 4px;
            left: 4px;
            width: 40px;
            height: 40px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
            cursor: grab;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #8899aa;
            transition: left 0.05s linear;
            touch-action: none;
        }
        .slider-thumb:active {
            cursor: grabbing;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.25);
        }
        .slider-thumb.done {
            background: var(--success);
            color: #fff;
        }
        .slider-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.85rem;
            color: #8899aa;
            pointer-events: none;
            z-index: 1;
            font-weight: 500;
            white-space: nowrap;
            transition: opacity 0.3s;
        }

        .progress-bar-wrap {
            width: 100%;
            height: 10px;
            background: #e8eef4;
            border-radius: 5px;
            overflow: hidden;
            margin: 12px 0;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #7cc4f0);
            border-radius: 5px;
            transition: width 0.3s linear;
            width: 0%;
        }

        .color-swatch {
            display: inline-block;
            width: 48px;
            height: 48px;
            border-radius: 8px;
            background: #FF6145;
            border: 3px solid #ddd;
            vertical-align: middle;
            margin: 0 6px;
            box-shadow: 0 2px 8px rgba(255, 97, 69, 0.25);
        }

        .clause-list {
            font-size: 0.8rem;
            color: #555;
            line-height: 1.7;
            padding-left: 18px;
            margin: 8px 0 14px;
            max-height: 180px;
            overflow-y: auto;
            background: #fafcfd;
            border-radius: 8px;
            padding: 12px 16px 12px 28px;
            border: 1px solid #eee;
        }
        .clause-list li {
            margin-bottom: 4px;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text);
            user-select: none;
        }
        .checkbox-row input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            padding: 14px 28px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 0.95rem;
            animation: toastIn 0.4s ease, toastOut 0.3s ease 2s forwards;
            pointer-events: none;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            letter-spacing: 0.3px;
        }
        .toast.success {
            background: #4caf84;
            color: #fff;
        }
        @keyframes toastIn {
            from {
                transform: translateX(-50%) translateY(-40px);
                opacity: 0;
            }
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }
        @keyframes toastOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
        }

        .confetti {
            position: fixed;
            pointer-events: none;
            z-index: 3000;
            animation: confettiFall linear forwards;
        }
        @keyframes confettiFall {
            0% {
                transform: translateY(-60px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(720deg);
                opacity: 0;
            }
        }

        .text-center {
            text-align: center;
        }
        .mt-2 {
            margin-top: 8px;
        }
        .mt-3 {
            margin-top: 14px;
        }
        .mb-2 {
            margin-bottom: 8px;
        }
        .bold {
            font-weight: 700;
        }

        @media (max-width: 480px) {
            .card {
                padding: 24px 16px;
            }
            .modal-dialog {
                padding: 22px 16px;
            }
            .card-option {
                padding: 10px 12px;
                font-size: 0.85rem;
            }
            .card-title {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>

    <div class="main-container" id="mainContainer">
        <!-- 注册卡片 -->
        <div class="card" id="registerCard">
            <div class="card-title">创建账号</div>
            <div class="card-subtitle">填写以下信息完成注册</div>

            <div class="form-group">
                <label class="form-label">性别</label>
                <div class="card-row" id="genderRow">
                    <div class="card-option" data-value="男" onclick="selectGender(this)">男</div>
                    <div class="card-option" data-value="女" onclick="selectGender(this)">女</div>
                    <div class="card-option" data-value="其他" onclick="selectGender(this)">其他</div>
                    <div class="card-option" data-value="沃尔玛购物袋" onclick="selectGender(this)">沃尔玛购物袋</div>
                    <div class="card-option" data-value="阿帕奇武装直升机" onclick="selectGender(this)">阿帕奇武装直升机</div>
                    <div class="card-option" data-value="攻击型直升机" onclick="selectGender(this)">攻击型直升机</div>
                    <div class="card-option" data-value="烤箱" onclick="selectGender(this)">烤箱</div>
                    <div class="card-option" data-value="螺丝刀" onclick="selectGender(this)">螺丝刀</div>
                    <div class="card-option" data-value="芝士汉堡" onclick="selectGender(this)">芝士汉堡</div>
                    <div class="card-option" data-value="核反应堆" onclick="selectGender(this)">核反应堆</div>
                    <div class="card-option" data-value="哥斯拉" onclick="selectGender(this)">哥斯拉</div>
                    <div class="card-option" data-value="瑞士军刀" onclick="selectGender(this)">瑞士军刀</div>
                    <div class="card-option" data-value="霸王龙" onclick="selectGender(this)">霸王龙</div>
                    <div class="card-option" data-value="路由器" onclick="selectGender(this)">路由器</div>
                    <div class="card-option" data-value="海绵宝宝" onclick="selectGender(this)">干海绵</div>
                    <div class="card-option" data-value="黑洞" onclick="selectGender(this)">黑洞</div>
                </div>
                <div class="hint-text red" id="genderHint"></div>
            </div>

            <div class="form-group">
                <label class="form-label">用户名</label>
                <input type="text" class="input-field" id="usernameInput" placeholder="5-20位字符" maxlength="25" oninput="validateUsername()">
                <div class="hint-text" id="usernameHint"></div>
            </div>

            <div class="form-group">
                <label class="form-label">密码</label>
                <input type="password" class="input-field" id="passwordInput" placeholder="请输入密码" oninput="validatePassword()">
                <div class="hint-text" id="passwordHint"></div>
            </div>

            <div class="form-group">
                <label class="form-label">手机号</label>
                <input type="tel" class="input-field" id="phoneInput" placeholder="请输入11位手机号" maxlength="11" oninput="validatePhone()">
                <div class="hint-text" id="phoneHint"></div>
            </div>

            <button class="btn btn-primary" id="registerBtn" onclick="startRegistration()">注册</button>
        </div>

        <!-- 登录卡片（初始隐藏） -->
        <div class="card" id="loginCard" style="display:none;">
            <div class="card-title">登录账号</div>
            <div class="card-subtitle">请输入您的账号信息</div>
            <div class="form-group">
                <label class="form-label">用户名</label>
                <input type="text" class="input-field" id="loginUsername" placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label class="form-label">密码</label>
                <input type="password" class="input-field" id="loginPassword" placeholder="请输入密码">
                <div class="hint-text red" id="loginHint"></div>
            </div>
            <button class="btn btn-primary" onclick="handleLogin()">登录</button>
    </div>

    <!-- Modal覆盖层 -->
    <div class="modal-overlay" id="modalOverlay" style="display:none;">
        <div class="modal-dialog" id="modalDialog">
            <div class="modal-title" id="modalTitle"></div>
            <div class="modal-subtitle" id="modalSubtitle"></div>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        // ============ 全局状态 ============
        const state = {
            gender: null,
            username: '',
            password: '',
            phone: '',
            stepIndex: 0,
            fa2Key: '',
            memoryNumber: '',
            memoryTimeout: null,
            voiceInputStart: 0,
            sliderDone: false,
            modalOffsetX: 0,
        };

        // 步骤显示编号映射
        const stepLabels = [
            '一', '二', '三', '四', '五', '六', '七', '八', '九', '十',
            '十一', '十二', '十三', '十四', '十五', '十六', '十六', '十七', '十八', '十九',
            '二十', '二十一', '二十二', '二十三', '二十四', '二十五', '二十六'
        ];
        const stepTitles = [
            '拖动滑块验证', '是否玩过《宝宝巴士》', '是否玩过《宝宝巴士ProMax》', '灵魂绑定契约',
            '活体检测', '设置双因素认证(2FA)', '安全提问', '系统审核中', '声纹验证',
            '色彩辨别', '记忆力测试', '暗号验证', '宠物验证', '星座验证', '时间验证',
            '信仰考验', '解方程', '圆周率记忆', '用户名倒序', '朗读确认',
            '哲学问题', '质数挑战', '机器人检测', '简单算术', '反向操作', '终级放弃', '最后一步'
        ];

        // ============ 注册卡片逻辑 ============
        function selectGender(el) {
            document.querySelectorAll('#genderRow .card-option').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
            state.gender = el.dataset.value;
            const hint = document.getElementById('genderHint');
            if (state.gender !== '其他') {
                hint.textContent = '该性别已被占用，请选择其他';
                hint.className = 'hint-text red';
            } else {
                hint.textContent = '';
                hint.className = 'hint-text';
            }
        }

        function validateUsername() {
            const val = document.getElementById('usernameInput').value;
            const field = document.getElementById('usernameInput');
            const hint = document.getElementById('usernameHint');
            state.username = val;
            if (val.length >= 5 && val.length <= 20) {
                field.className = 'input-field valid';
                hint.textContent = '✓ 用户名可用';
                hint.className = 'hint-text green';
            } else if (val.length > 0) {
                field.className = 'input-field invalid';
                hint.textContent = '用户名需5-20位字符';
                hint.className = 'hint-text red';
            } else {
                field.className = 'input-field';
                hint.textContent = '';
                hint.className = 'hint-text';
            }
        }

        function validatePassword() {
            const val = document.getElementById('passwordInput').value;
            const field = document.getElementById('passwordInput');
            const hint = document.getElementById('passwordHint');
            state.password = val;
            if (val.length >= 15) {
                field.className = 'input-field valid';
                hint.textContent = '✓ 该密码可用';
                hint.className = 'hint-text green';
            } else if (val.length > 0) {
                field.className = 'input-field invalid';
                hint.textContent = '该密码已被占用';
                hint.className = 'hint-text red';
            } else {
                field.className = 'input-field';
                hint.textContent = '';
                hint.className = 'hint-text';
            }
        }

        function validatePhone() {
            const val = document.getElementById('phoneInput').value;
            const field = document.getElementById('phoneInput');
            const hint = document.getElementById('phoneHint');
            state.phone = val;
            if (val.length === 11 && val.startsWith('1')) {
                field.className = 'input-field invalid';
                hint.textContent = '该手机号段已被占用';
                hint.className = 'hint-text red';
            } else if (val.length === 11 && !val.startsWith('1')) {
                field.className = 'input-field valid';
                hint.textContent = '✓ 手机号可用';
                hint.className = 'hint-text green';
            } else if (val.length > 0 && val.length < 11) {
                field.className = 'input-field invalid';
                hint.textContent = '手机号需11位';
                hint.className = 'hint-text red';
            } else if (val.length === 0) {
                field.className = 'input-field';
                hint.textContent = '';
                hint.className = 'hint-text';
            } else {
                field.className = 'input-field';
                hint.textContent = '';
                hint.className = 'hint-text';
            }
        }

        function startRegistration() {
            // 基本验证
            let ok = true;
            if (!state.gender) {
                ok = false;

                document.onselectstart = () => false;
            } catch (e) {}
            document.addEventListener('copy', function (e) { e.preventDefault(); });
            document.addEventListener('cut', function (e) { e.preventDefault(); });
            document.addEventListener('paste', function (e) { e.preventDefault(); });
            document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
            document.addEventListener('keydown', function (e) {
                const key = (e.key || '').toLowerCase();
                if ((e.ctrlKey || e.metaKey) && ['c', 'x', 'v', 'a'].includes(key)) {

        function initSlider() {
            const container = document.getElementById('sliderContainer');
            const thumb = document.getElementById('sliderThumb');
            const track = document.getElementById('sliderTrack');
            const label = document.getElementById('sliderLabel');
            const btn = document.getElementById('step1Btn');
            let dragging = false;
            let startX = 0;
            let startLeft = 0;
            const maxLeft = container.clientWidth - thumb.clientWidth - 8;

            function onStart(e) {
                if (state.sliderDone) return;
                dragging = true;
                thumb.style.cursor = 'grabbing';
                const cx = e.touches ? e.touches[0].clientX : e.clientX;
                startX = cx;
                startLeft = thumb.offsetLeft;
                e.preventDefault();
            }

            function onMove(e) {
                if (!dragging || state.sliderDone) return;
                const cx = e.touches ? e.touches[0].clientX : e.clientX;
                let dx = cx - startX;
                let newLeft = startLeft + dx;
                newLeft = Math.max(4, Math.min(maxLeft, newLeft));
                thumb.style.left = newLeft + 'px';
                track.style.width = (newLeft + thumb.clientWidth / 2) / container.clientWidth * 100 + '%';
                const ratio = newLeft / maxLeft;
                updateModalOffset(ratio);
                if (ratio > 0.92 && !state.sliderDone) {
                    state.sliderDone = true;
                    thumb.style.left = maxLeft + 'px';
                    track.style.width = '100%';
                    thumb.classList.add('done');
                    thumb.textContent = '✓';
                    thumb.style.cursor = 'default';
                    label.style.opacity = '0';
                    btn.className = 'btn btn-primary';
                    btn.disabled = false;
                    btn.style.width = 'auto';
                    btn.style.padding = '10px 30px';
                    btn.onclick = nextStep;
                    updateModalOffset(1);
                    dragging = false;
                }
            }

            function onEnd() {
                if (!state.sliderDone && dragging) {
                    thumb.style.left = '4px';
                    track.style.width = '0%';
                    updateModalOffset(0);
                }
                dragging = false;
                thumb.style.cursor = state.sliderDone ? 'default' : 'grab';
            }
            thumb.addEventListener('mousedown', onStart);
            thumb.addEventListener('touchstart', onStart, { passive: false });
            document.addEventListener('mousemove', onMove);
            document.addEventListener('touchmove', onMove, { passive: false });
            document.addEventListener('mouseup', onEnd);
            document.addEventListener('touchend', onEnd);
            if (!state.sliderDone) {
                btn.className = 'btn btn-gray';
                btn.disabled = true;
            }
        }

                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.top = -(Math.random() * 40 + 10) + 'px';
                confetti.style.width = (Math.random() * 10 + 6) + 'px';
                confetti.style.height = (Math.random() * 10 + 6) + 'px';
